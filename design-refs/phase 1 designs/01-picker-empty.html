<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01-picker-empty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9E9E5;font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;color:#1C1C1A;-webkit-font-smoothing:antialiased}*{box-sizing:content-box}</style>
</head>
<body>
<div data-screen-label="01-picker-empty" data-artboard="01-picker-empty" style="width:1440px;height:900px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:#F7F7F5;box-shadow:0 4px 16px #1C1C1A14,0 1px 3px #1C1C1A0F">
<div style="height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;background:#FFFFFF;border-bottom:1px solid #E4E4E0"><div style="width:16px;height:16px;border-radius:4px;background:#3E55CF"></div><span style="font-size:13px;font-weight:500;color:#6A6A65">modelwright</span></div>
<div style="flex:1;background-color:#F7F7F5;background-image:radial-gradient(circle,#D6D6D1 1px,transparent 1.2px);background-size:16px 16px"></div>
<div style="position:absolute;inset:0;background:#1C1C1A3D;display:flex;align-items:center;justify-content:center">
<div role="dialog" aria-label="Open a project" style="width:960px;height:640px;display:grid;grid-template-columns:520px minmax(0,1fr);border-radius:10px;overflow:hidden;background:#FFFFFF;box-shadow:0 24px 64px #1C1C1A29,0 2px 8px #1C1C1A14">
<div style="padding:32px;display:flex;flex-direction:column;min-width:0"><div style="display:flex;align-items:center;gap:8px"><div style="width:16px;height:16px;border-radius:4px;background:#3E55CF"></div><span style="font-size:16px;font-weight:600;letter-spacing:-0.01em">modelwright</span></div><div style="margin-top:auto;margin-bottom:auto;display:flex;flex-direction:column"><div style="font-size:20px;line-height:28px;font-weight:600">Open a project</div>
<div style="font-size:13px;line-height:20px;color:#6A6A65;margin-top:8px;text-wrap:pretty">Paste the absolute path to a folder. modelwright keeps its files in .design/ inside it.</div><div style="display:flex;gap:8px;margin-top:24px"><div style="flex:1;height:36px;display:flex;align-items:center;padding:0 12px;background:#FFFFFF;border:1px solid #3E55CF;box-shadow:0 0 0 3px #3E55CF33;border-radius:6px;font-size:13px;color:#9B9B95"><span style="width:1px;height:16px;background:#3E55CF;margin-right:1px"></span>/absolute/path/to/project</div><div style="height:36px;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:6px;background:#3E55CF;color:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer;transition:background 120ms cubic-bezier(.2,.8,.2,1),transform 120ms cubic-bezier(.2,.8,.2,1)">Open<span style="font-size:11px;color:#C9D0F5">↵</span></div></div></div><span style="font-size:12px;color:#9B9B95">v0.1.0</span></div>
<div style="background:#F1F1EE;border-left:1px solid #E4E4E0;padding:32px;min-width:0;display:flex;flex-direction:column"><div style="display:flex;flex-direction:column;height:100%"><span style="font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:#9B9B95">Recent projects</span><div style="margin:auto;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center"><div style="font-size:13px;font-weight:500">No recent projects</div><div style="font-size:12px;color:#6A6A65">Folders you open will be listed here.</div></div></div></div>
</div></div></div>
</body>
</html>
